services:
  postgres:
    image: postgres:16-alpine
    container_name: unimanage-db
    restart: always
    environment:
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: unimanage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimanage-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://cms_user:cms_password@postgres:5432/unimanage?sslmode=disable"
      DIRECT_URL: "postgresql://cms_user:cms_password@postgres:5432/unimanage?sslmode=disable"
      JWT_SECRET: "unimanage_production_secret_key_change_in_production_123456789"
      PORT: 5000
    depends_on:
      - postgres

volumes:
  pgdata:
